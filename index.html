
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation des captures CIMEA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #eff2f8;
      color: #233149;
      font-family: Arial, sans-serif;
    }

    /* Barre supérieure discrète */
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 12px;
      background: white;
      border-bottom: 1px solid #dbe2ed;
    }

    .notice {
      font-size: 11px;
      color: #596474;
    }

    /* Contrôles de zoom */
    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    button {
      padding: 4px 9px;
      background: white;
      border: 1px solid #c8d0df;
      border-radius: 6px;
      cursor: pointer;
    }

    #zoom {
      min-width: 45px;
      text-align: center;
      font-size: 11px;
    }

    /* Visionneuse */
    .viewport {
      width: 100%;
      overflow-x: auto;
    }

    .sheet {
      width: 100%;
      margin: auto;
      background: white;
    }

    .sheet img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: #596474;
    }
  </style>
</head>

<body>

  <header>
    <div class="notice">
      Captures d'écran — sans vérification officielle CIMEA
    </div>

    <div class="controls">
      <button id="minus" type="button">−</button>
      <output id="zoom">100 %</output>
      <button id="plus" type="button">+</button>
      <button id="reset" type="button">Réinitialiser</button>
    </div>
  </header>

  <main class="viewport">
    <div class="sheet" id="sheet">

      <img
        src="cimea-haut.png"
        alt="Première capture CIMEA"
      >

      <img
        src="cimea-bas.png"
        alt="Deuxième capture CIMEA"
      >

    </div>
  </main>

  <footer>
    Reproduction visuelle de captures d'écran.
    Vérification officielle auprès de CIMEA.
  </footer>

  <script>
    const sheet = document.getElementById("sheet");
    const zoom = document.getElementById("zoom");

    let scale = 1;

    function setZoom(value) {
      scale = Math.max(
        0.6,
        Math.min(2.5, Math.round(value * 10) / 10)
      );

      sheet.style.width = (scale * 100) + "%";

      zoom.textContent =
        Math.round(scale * 100) + " %";
    }

    document.getElementById("plus").onclick = () => {
      setZoom(scale + 0.2);
    };

    document.getElementById("minus").onclick = () => {
      setZoom(scale - 0.2);
    };

    document.getElementById("reset").onclick = () => {
      setZoom(1);
    };
  </script>

</body>
</html>
