
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Consultation des captures CIMEA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #e9edf3;
      color: #233149;
      font-family: Arial, sans-serif;
    }

    /* Barre discrète */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 10px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .notice {
      font-size: 10px;
      color: #667085;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    button {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    #zoom {
      font-size: 11px;
      min-width: 45px;
      text-align: center;
    }

    /* Affichage portrait */
    .viewport {
      width: 100%;
      min-height: 100vh;
      overflow-x: auto;
      padding: 12px 0;
    }

    .sheet {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .sheet img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 10px;
      color: #667085;
    }

    @media (max-width: 480px) {
      .viewport {
        padding: 0;
      }

      .sheet {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="notice">
      Captures d'écran — sans vérification officielle CIMEA
    </div>

    <div class="controls">
      <button id="minus">−</button>
      <output id="zoom">100 %</output>
      <button id="plus">+</button>
      <button id="reset">Réinitialiser</button>
    </div>
  </header>

  <main class="viewport" id="viewport">

    <div class="sheet" id="sheet">

      <img
        src="cimea-haut.png"
        alt="Première capture CIMEA"
      >

      <img
        src="cimea-bas.png"
        alt="Deuxième capture CIMEA"
      >

    </div>

  </main>

  <footer>
    Reproduction visuelle de captures d'écran.
    Vérification officielle auprès de CIMEA.
  </footer>

  <script>
    const sheet = document.getElementById("sheet");
    const viewport = document.getElementById("viewport");
    const zoom = document.getElementById("zoom");

    let scale = 1;

    function setZoom(value) {
      scale = Math.max(
        0.6,
        Math.min(2.5, Math.round(value * 10) / 10)
      );

      const baseWidth = Math.min(
        430,
        viewport.clientWidth
      );

      sheet.style.maxWidth = "none";
      sheet.style.width =
        Math.round(baseWidth * scale) + "px";

      zoom.textContent =
        Math.round(scale * 100) + " %";
    }

    document.getElementById("plus").onclick =
      () => setZoom(scale + 0.2);

    document.getElementById("minus").onclick =
      () => setZoom(scale - 0.2);

    document.getElementById("reset").onclick =
      () => setZoom(1);

    window.addEventListener("resize",
      () => setZoom(scale)
    );

    setZoom(1);
  </script>

</body>
</html>
