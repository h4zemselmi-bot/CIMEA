<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captures de la page CIMEA — consultation</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eff2f8;color:#233149;font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 1px 6px #0002;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.notice{font-weight:650}.notice small{display:block;font-weight:400;color:#596474}.controls{display:flex;gap:7px;align-items:center}.controls button{border:1px solid #c8d0df;background:#fff;border-radius:8px;padding:7px 11px;font-size:16px;cursor:pointer}.controls output{min-width:50px;text-align:center}.viewport{overflow-x:auto;width:100%}.sheet{width:100%;max-width:none;margin:auto;background:#fff;transform-origin:top left}.sheet img{display:block;width:100%;height:auto}footer{padding:16px;color:#566579;text-align:center}.sheet img+img{border-top:1px solid #dbe2ed}@media(min-width:1200px){.sheet{max-width:1902px}}
</style>
</head>
<body>
<header><div class="notice">Consultation des captures d’écran<small>Images statiques — aucune vérification CIMEA n’est effectuée ici.</small></div><div class="controls"><button type="button" id="minus" aria-label="Réduire">−</button><output id="zoom">100 %</output><button type="button" id="plus" aria-label="Agrandir">+</button><button type="button" id="reset">Réinitialiser</button></div></header>
<main class="viewport"><div class="sheet" id="sheet"><img src="cimea-haut.png" alt="Première capture d’écran de la page CIMEA"/><img src="cimea-bas.png" alt="Seconde capture d’écran de la page CIMEA"/></div></main>
<footer>Reproduction visuelle de captures d’écran, non affiliée à CIMEA. Pour vérifier un diplôme, utilisez le service officiel.</footer>
<script>
const s=document.getElementById('sheet'),z=document.getElementById('zoom');let scale=1;
function setZoom(v){scale=Math.max(.6,Math.min(2.5,Math.round(v*10)/10));s.style.width=(scale*100)+'%';s.style.maxWidth='none';z.textContent=Math.round(scale*100)+' %'}
document.getElementById('plus').onclick=()=>setZoom(scale+.2);
document.getElementById('minus').onclick=()=>setZoom(scale-.2);
document.getElementById('reset').onclick=()=>setZoom(1);
</script>
</body></html>
